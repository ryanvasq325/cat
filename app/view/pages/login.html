<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    {{ vite('resources/css/app.css') }}
</head>

<body>

    <form id="form">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12">
                    <div class="card mt-3">
                        <div class="card-header">Autenticação do Sistema</div>
                        <div class="card-body">
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="login" name="login"
                                    placeholder="name@example.com">
                                <label for="login">Login,CPF OU Telefone ou E-mail</label>
                            </div>
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="senha" name="senha" placeholder="senha">
                                <label for="senha">Informe sua senha</label>
                            </div>
                        </div>
                        <div class="card-footer">
                            <button id="login" type="button" class="btn btn-success">Login</button>
                            <button id="login" type="button" class="btn btn-primary">Login com Google</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
    {{ vite('resources/js/app.js') }}
</body>

</html>
